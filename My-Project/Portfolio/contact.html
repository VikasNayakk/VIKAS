<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aliens Site | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Exo+2:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient"></div>
  <div class="noise" aria-hidden="true"></div>

  <aside class="quick-sidebar glow-frame mono" aria-label="Sidebar Menu">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="gallery.html">Gallery</a>
    <a class="active" href="contact.html">Contact</a>
  </aside>

  <div class="site-wrap">
    <header class="site-header glow-frame">
      <div class="brand"><img class="brand-logo" src="assets/characters/aliens-badge.png" alt="Aliens Certified badge" /><div><p class="mono">ALIENS COMPANY</p><h1>CONTACT STATION</h1></div></div>
      <nav class="main-nav mono">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Characters</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </header>
    <main class="layout">
      <aside class="char-rail glow-frame" data-rail>
        <div class="rail-track">
          <figure class="char-card"><img src="assets/characters/char-1.png" alt="Alien character 1" /><figcaption>WING MONKEY</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-2.png" alt="Alien character 2" /><figcaption>RETRO BOSS</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-3.png" alt="Alien character 3" /><figcaption>MASK TEAM</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-1.png" alt="Alien character 1 copy" /><figcaption>WING MONKEY</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-2.png" alt="Alien character 2 copy" /><figcaption>RETRO BOSS</figcaption></figure>
        </div>
      </aside>

      <section class="content">
        <section class="glow-tile panel long">
          <h2>Connect</h2>
          <p>Mission collaborations aur website builds ke liye connect karein.</p>
          <form class="contact-form">
            <input type="text" placeholder="Your name" />
            <input type="email" placeholder="Your email" />
            <textarea rows="5" placeholder="Write your message"></textarea>
            <button type="button" class="btn">Send Signal</button>
          </form>
        </section>
      </section>

      <aside class="char-rail glow-frame right" data-rail>
        <div class="rail-track reverse">
          <figure class="char-card"><img src="assets/characters/char-2.png" alt="Alien character right 1" /><figcaption>RETRO BOSS</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-3.png" alt="Alien character right 2" /><figcaption>MASK TEAM</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-1.png" alt="Alien character right 3" /><figcaption>WING MONKEY</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-2.png" alt="Alien character right 1 copy" /><figcaption>RETRO BOSS</figcaption></figure>
          <figure class="char-card"><img src="assets/characters/char-3.png" alt="Alien character right 2 copy" /><figcaption>MASK TEAM</figcaption></figure>
        </div>
      </aside>
    </main>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
